  <!-- case -->
  <rect x="42" y="26" width="428" height="460" rx="58" fill="#cf2434" stroke="#1a1a1a" stroke-width="20"/>

  <!-- lens -->
  <circle cx="126" cy="116" r="50" fill="#f2efe9" stroke="#1a1a1a" stroke-width="14"/>
  <circle cx="126" cy="116" r="33" fill="#29a8e0" stroke="#1a1a1a" stroke-width="8"/>
  <circle cx="113" cy="103" r="11" fill="#bfe6fb"/>

  <!-- three lamps -->
  <circle cx="232" cy="98" r="18" fill="#e04b45" stroke="#1a1a1a" stroke-width="8"/>
  <circle cx="286" cy="98" r="18" fill="#f0b429" stroke="#1a1a1a" stroke-width="8"/>
  <circle cx="340" cy="98" r="18" fill="#4caf50" stroke="#1a1a1a" stroke-width="8"/>

